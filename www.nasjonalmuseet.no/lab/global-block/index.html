<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global block – 57 000 kunstverk</title>
<link rel="stylesheet" href="artfield.css">
<style>
  /* Figma: «Global Block» (24285:122234), 1608 × 900 – skalerer med bredden */
  @font-face {
    font-family: "MuseetSansVF-lab";
    src: url(/dist/fonts/MuseetSansTextVFfd038091f5fd9cc2.woff2) format("woff2");
    font-weight: 300 900; font-display: block;
    ascent-override: 100.4%; descent-override: 18.8%; line-gap-override: 0%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; font-family: "MuseetSansVF-lab", sans-serif; }
  .gb { height: calc(900 * 100vw / 1608); }
  .gb .af__text { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(64 * var(--u)); }
  .gb__title {
    margin: 0; text-align: center;
    font-size: calc(130 * var(--u)); line-height: calc(120 * var(--u)); letter-spacing: calc(-2.6 * var(--u));
    opacity: 0; font-weight: 300;
  }
  .gb.is-in .gb__title { opacity: 1; font-weight: 400; transition: opacity 500ms ease-out 200ms, font-weight 1s var(--af-ease) 200ms; }
  /* Knapp (Button/Large, Primary): sort, 50 høy, 24 luft, radius 4, 18px. Lang pil glir inn ved hover. */
  .gb__btn {
    display: inline-flex; align-items: center; height: 50px; padding: 0 24px; border-radius: 4px;
    background: #000; color: #fff; text-decoration: none; font-size: 18px; line-height: 1;
    opacity: 0; transition: opacity 500ms ease-out 500ms;
  }
  .gb.is-in .gb__btn { opacity: 1; }
  .gb__btn svg { width: 0; margin-left: 0; opacity: 0; flex-shrink: 0; transition: width 300ms var(--af-ease), margin 300ms var(--af-ease), opacity 300ms; }
  .gb__btn:is(:hover, :focus-visible) svg { width: 32px; margin-left: 8px; opacity: 1; }
</style>
</head>
<body>
<section class="gb" id="gb" aria-label="57 000 kunstverk">
  <div class="af__text">
    <h2 class="gb__title">57 000<br>kunstverk</h2>
    <a class="gb__btn" href="/samlingen/">Utforsk samlingen<svg viewBox="0 0 31 12" height="12" fill="none" aria-hidden="true"><path d="M0 5.33333L28.4167 5.33333L23.25 0L25.1875 0L31 6L25.1875 12H23.25L28.4167 6.66667L0 6.66667L0 5.33333Z" fill="currentColor"/></svg></a>
  </div>
</section>
<script src="artfield.js"></script>
<script>
  ArtField.mount(document.getElementById('gb'), { layout: 'scatter', info: /[?&]info=1/.test(location.search) });
</script>
</body>
</html>
