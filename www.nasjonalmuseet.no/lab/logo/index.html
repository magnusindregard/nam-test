<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logoanimasjon – Lottie</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: #111; background: #fff; }
  .row { display: flex; gap: 48px; padding: 48px; align-items: flex-start; flex-wrap: wrap; }
  .box { display: grid; gap: 12px; justify-items: start; }
  .logo { width: 80px; height: 100px; color: #000; }
  .dark { background: #000; padding: 24px; }
  .dark .logo { color: #fff; }
  /* Fargen følger CSS (svart/hvit). Ikke maskene: de skjærer ut a og m og må beholde sine egne farger. */
  .logo svg path:not(mask path, clipPath path) { fill: currentColor; }
  button { font: inherit; padding: 6px 12px; }
  .big .logo { width: 240px; height: 300px; }
  code { color: #666; }
</style>
</head>
<body>
<div class="row">
  <div class="box"><div class="logo" id="l1"></div><code>80 × 100 (som i headeren)</code></div>
  <div class="box dark"><div class="logo" id="l2"></div><code style="color:#aaa">hvit på sort</code></div>
  <div class="box big"><div class="logo" id="l3"></div><code>stor</code></div>
</div>
<div style="padding: 0 48px"><button id="again">Spill av igjen</button> <code id="info"></code></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script>
  // Spill bare selve animasjonen (bilde 0–30), og beskjær til logoen (komposisjonen er 480×480 med luft rundt)
  var anims = ['l1', 'l2', 'l3'].map(function (id) {
    var a = lottie.loadAnimation({ container: document.getElementById(id), renderer: 'svg', loop: false, autoplay: false,
      path: 'logo.json', rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } });
    a.addEventListener('DOMLoaded', function () {
      a.goToAndStop(30, true);
      var svg = a.renderer.svgElement, b = svg.querySelector('g').getBBox();
      svg.setAttribute('viewBox', [b.x, b.y, b.width, b.height].map(function (n) { return Math.round(n * 10) / 10; }).join(' '));
      document.getElementById('info').textContent = 'logo i komposisjonen: ' + Math.round(b.width) + ' × ' + Math.round(b.height) +
        ', ' + a.totalFrames + ' bilder à ' + Math.round(1000 / a.frameRate) + ' ms';
      a.playSegments([0, 30], true);
    });
    return a;
  });
  document.getElementById('again').onclick = function () { anims.forEach(function (a) { a.playSegments([0, 30], true); }); };
</script>
</body>
</html>
